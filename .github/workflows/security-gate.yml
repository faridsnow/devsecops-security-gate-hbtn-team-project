name: "🛡️ DevSecOps Automated Security Gate"

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  security-audit:
    name: "Static Security & Secret Audit"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Repozitoriyanı Yüklə (Checkout)"
        uses: actions/checkout@v4

      - name: "🐍 Python 3.11 Mühitini Quraşdır"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 Asılılıqları Yüklə (Install Dependencies)"
        run: |
          python -m pip install --upgrade pip
          pip install requests colorama
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: "🔍 Təhlükəsizlik və Secret Skanını İcra Et"
        id: security_scan
        continue-on-error: true
        run: |
          python scripts/security_scanner.py --target . --output security_report.json

      - name: "📊 Dashboard-a Nəticəni Göndər (Webhook)"
        if: always()
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
        run: |
          if [ -f normalized_report.json ] && [ -n "$DASHBOARD_URL" ]; then
            # Prepare payload with git info and scan status
            export SCAN_STATUS="PASSED"
            if [ "${{ steps.security_scan.outcome }}" == "failure" ]; then
              export SCAN_STATUS="BLOCKED"
            fi

            python3 -c "
          import json, os, subprocess, sys, time
          from datetime import datetime, timezone

          # Load normalized report
          with open('normalized_report.json', 'r', encoding='utf-8') as f:
              report = json.load(f)

          findings = report.get('findings', [])
          stats = report.get('stats', {})

          # Files scanned from raw report
          files_scanned = stats.get('raw_findings_count', 0)
          if os.path.exists('security_report.json'):
              try:
                  with open('security_report.json', 'r', encoding='utf-8') as sf:
                      files_scanned = json.load(sf).get('summary', {}).get('files_scanned', files_scanned)
              except Exception:
                  pass

          # Git info
          commit = subprocess.getoutput('git rev-parse HEAD').strip()
          branch = os.environ.get('GITHUB_REF_NAME') or subprocess.getoutput('git rev-parse --abbrev-ref HEAD').strip()
          author = subprocess.getoutput('git log -1 --format=%an').strip() or os.environ.get('GITHUB_ACTOR', 'N/A')
          message = subprocess.getoutput('git log -1 --format=%s').strip()

          # Build dashboard payload
          payload = {
              'timestamp': datetime.now(timezone.utc).isoformat(),
              'scanner_version': '1.0.0',
              'status': os.environ.get('SCAN_STATUS', 'PASSED'),
              'summary': {
                  'files_scanned': files_scanned,
                  'total_findings': stats.get('unique_findings_count', 0),
                  'critical': stats.get('critical_count', 0),
                  'high': stats.get('high_count', 0),
                  'medium': stats.get('medium_count', 0),
                  'low': stats.get('low_count', 0)
              },
              'findings': findings,
              'git_info': {
                  'commit': commit,
                  'branch': branch,
                  'author': author,
                  'message': message
              }
          }

          import requests

          base_url = os.environ['DASHBOARD_URL'].rstrip('/')
          webhook_url = base_url + '/api/webhook'
          health_url = base_url + '/api/health'
          headers = {'X-API-Key': os.environ.get('DASHBOARD_API_KEY', ''), 'Content-Type': 'application/json'}

          # Wake up the Render free-tier service before sending the webhook
          print('Waking up Render service...')
          for attempt in range(3):
              try:
                  r = requests.get(health_url, timeout=60)
                  print(f'Health check: {r.status_code}')
                  break
              except Exception as e:
                  print(f'Wake-up attempt {attempt+1}/3 failed: {e}')
                  if attempt < 2:
                      time.sleep(5)

          # Send webhook with retry
          sent = False
          for attempt in range(3):
              try:
                  r = requests.post(webhook_url, json=payload, headers=headers, timeout=30)
                  print(f'Dashboard webhook: {r.status_code} - {r.text}')
                  sent = True
                  break
              except Exception as e:
                  print(f'Webhook attempt {attempt+1}/3 failed: {e}')
                  if attempt < 2:
                      time.sleep(5)

          if not sent:
              print('WARNING: All webhook attempts failed. Dashboard was not updated.')
          "
          else
            echo "Skipping dashboard webhook (no report or URL)"
          fi

      - name: "📱 Telegram Alert & Xəbərdarlıq Bildirişi Göndər"
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/telegram_notifier.py --report security_report.json

      - name: "📊 GitHub Step Summary Hesabatını Əlavə Et"
        if: always()
        run: |
          if [ -f security_report.json ]; then
            echo "## 🛡️ DevSecOps Pipeline Security Gate Hesabatı" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**İcra Tarixi:** $(date)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat security_report.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "🛑 PR / CI Bloklama Yoxlanışı (Enforce Gate)"
        if: steps.security_scan.outcome == 'failure'
        run: |
          echo "::error::❌ Kritik təhlükəsizlik xətaları və ya sızmış gizli açarlar aşkarlandığı üçün bu PR / Push bloklandı!"
          exit 1
