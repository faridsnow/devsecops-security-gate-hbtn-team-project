services:
  - type: web
    name: devsecops-dashboard
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DASHBOARD_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
